<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sia Roy - Your AI Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#020617;--panel:rgba(15,23,42,.8);--line:rgba(255,255,255,.1);--tx:#f1f5f9;--mut:#94a3b8;--ac:#6366f1;--err:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at top,rgba(99,102,241,.3),var(--bg) 60%);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.grad{background:linear-gradient(135deg,#4f46e5,#a855f7,#ec4899)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,#4f46e5,#db2777);border:0;font-weight:600}
#auth{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:400px;border-radius:20px;padding:28px 22px;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
.card h1{margin:0;font-size:26px}
.card p.sub{color:var(--mut);font-size:14px;margin:4px 0 18px}
.card input{width:100%;background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;outline:none}
.card input:focus{border-color:var(--ac)}
.err{color:var(--err);font-size:14px;text-align:left;min-height:20px;margin:0 0 10px}
.row{display:flex;gap:10px}.row .btn{flex:1}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-width:0 0 1px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;font-size:20px;margin:0;border-radius:11px}
.brand b{font-size:16px;display:block}.brand small{color:var(--mut);font-size:11px}
.tools{display:flex;gap:6px;align-items:center}
.tools .btn{padding:8px 10px;font-size:13px}
select{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;max-width:110px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px;max-width:100%}.m.u{justify-content:flex-end}
.b{max-width:85%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.m.u .b{background:linear-gradient(135deg,#4f46e5,#9333ea);border-top-right-radius:4px}
.m.a .b{border-top-left-radius:4px}
.b p{margin:0 0 8px}.b p:last-child{margin:0}
.b pre{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;position:relative}
.b code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:13px}
.b pre code{background:none;padding:0}
.cp{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px;border-radius:8px}
.note{text-align:center;font-size:11px;color:#a5b4fc}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px}
.chips button{white-space:nowrap;font-size:12px;border-radius:99px;padding:7px 12px}
form{display:flex;gap:6px;align-items:center;margin:6px 14px;padding:6px;border-radius:16px}
textarea{flex:1;background:none;border:0;outline:none;resize:none;max-height:110px;padding:8px 4px;font-size:14px}
form .btn{width:42px;height:42px;padding:0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 10px}
footer b{color:#c4b5fd}
</style>
</head>
<body>

<div id="auth">
  <div class="card panel">
    <div class="logo grad">🤖</div>
    <h1>Sia Roy</h1>
    <p class="sub">Login karo, apni chat history wapas pao</p>
    <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <p class="err" id="err"></p>
    <div class="row">
      <button class="btn pri" id="loginBtn">Login</button>
      <button class="btn" id="signBtn">Sign up</button>
    </div>
    <footer style="padding-top:18px">Developer: <b>Satyam Nishad</b></footer>
  </div>
</div>

<div id="app" class="hidden">
  <header class="panel">
    <div class="brand"><div class="logo grad">🤖</div><div><b>Sia Roy</b><small id="who"></small></div></div>
    <div class="tools">
      <select id="persona">
        <option value="friendly">🤝 Friendly</option>
        <option value="witty">😎 Witty</option>
        <option value="coder">💻 Coder</option>
        <option value="gamer">🎮 Gamer</option>
      </select>
      <button class="btn" id="voiceBtn" title="Voice reply">🔇</button>
      <button class="btn" id="clearBtn" title="Clear chat">🗑️</button>
      <button class="btn" id="outBtn" title="Logout">🚪</button>
    </div>
  </header>
  <div id="chat"></div>
  <div class="chips" id="chips">
    <button class="btn">🤣 Tell a funny coding joke</button>
    <button class="btn">🐍 Write a Python script</button>
    <button class="btn">🎮 Free Fire headshot tip</button>
    <button class="btn">🚀 Cool AI fact</button>
  </div>
  <form id="form" class="panel">
    <button type="button" class="btn" id="mic" title="Voice input">🎤</button>
    <textarea id="input" rows="1" placeholder="Kuch bhi pucho Babu..."></textarea>
    <button class="btn pri" type="submit">➤</button>
  </form>
  <footer>Developer: <b>Satyam Nishad</b></footer>
</div>

<script>
// Developer: put a Gemini key here when hosting on GitHub. Users never see it.
const GEMINI_API_KEY = '';
const MODEL = 'gemini-2.5-flash';
const PROMPTS = {
  friendly:"You are 'Sia Roy', a warm, energetic Indian AI assistant. Speak in casual Hinglish. Be super helpful.",
  witty:"You are 'Sia Roy' in witty mode. Funny, playful Hinglish with punchlines.",
  coder:"You are 'Sia Roy', a senior software engineer. Casual Hinglish, clean commented code.",
  gamer:"You are 'Sia Roy' in gaming mode. Passionate gamer Hinglish (Free Fire, BGMI, Valorant)."
};
const $ = id => document.getElementById(id);
let user = null, hist = [], voice = false, persona = 'friendly';

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const mem = {};
const getUsers = () => { try{ return JSON.parse(store.get('sia_users')) || mem.users || {}; }catch(e){ return mem.users || {}; } };
const setUsers = u => { mem.users = u; store.set('sia_users', JSON.stringify(u)); };

async function hash(pw, salt){
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for (const c of data) h = ((h << 5) + h + c) | 0; return String(h);
}
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
marked.use({ renderer: { html(t){ return esc(typeof t === 'string' ? t : (t.text || '')); } } });

function showErr(m){ $('err').textContent = m; }

async function signup(){
  const name = $('u').value.trim(), pw = $('p').value;
  const key = name.toLowerCase();
  if (name.length < 3) return showErr('Username kam se kam 3 letters ka rakho.');
  if (pw.length < 4) return showErr('Password kam se kam 4 characters ka rakho.');
  const users = getUsers();
  if (users[key]) return showErr('Ye username pehle se hai, login karo.');
  const salt = Math.random().toString(36).slice(2);
  users[key] = { name, salt, hash: await hash(pw, salt) };
  setUsers(users);
  enter(key, name);
}
async function login(){
  const name = $('u').value.trim(), pw = $('p').value;
  const key = name.toLowerCase();
  const rec = getUsers()[key];
  if (!rec) return showErr('Ye account nahi mila. Pehle Sign up karo.');
  if (await hash(pw, rec.salt) !== rec.hash) return showErr('Username ya password galat hai.');
  enter(key, rec.name);
}
function enter(key, name){
  user = key; showErr('');
  store.set('sia_session', key);
  $('who').textContent = 'Hi, ' + name + ' 👋';
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  try{ hist = JSON.parse(store.get('sia_hist_' + key)) || []; }catch(e){ hist = []; }
  $('chat').innerHTML = '';
  if (!hist.length) addBot('Arrey aao ' + name + '! 👋 Main hoon **Sia Roy**, tumhari apni Desi AI dost. Code, jokes ya gaming tips, kuch bhi pucho!');
  else hist.forEach(h => h.role === 'user' ? addUser(h.text) : addBot(h.text));
  $('chat').scrollTop = $('chat').scrollHeight;
}
function logout(){
  store.del('sia_session'); user = null; hist = [];
  $('p').value = ''; $('app').classList.add('hidden'); $('auth').classList.remove('hidden');
}
const saveHist = () => user && store.set('sia_hist_' + user, JSON.stringify(hist.slice(-100)));

function addUser(t){
  const d = document.createElement('div'); d.className = 'm u';
  d.innerHTML = '<div class="b">' + esc(t).replace(/\n/g,'<br>') + '</div>';
  $('chat').appendChild(d); $('chat').scrollTop = 1e9;
}
function addBot(md){
  const d = document.createElement('div'); d.className = 'm a';
  d.innerHTML = '<div class="b panel">' + marked.parse(md) + '</div>';
  d.querySelectorAll('pre').forEach(pre => {
    const code = pre.innerText;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn cp'; b.textContent = 'Copy';
    b.onclick = () => { try{ navigator.clipboard.writeText(code); }catch(e){} b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy', 1500); };
    pre.appendChild(b);
  });
  $('chat').appendChild(d); $('chat').scrollTop = 1e9;
}
function note(t){ const d = document.createElement('div'); d.className = 'note'; d.textContent = t; $('chat').appendChild(d); $('chat').scrollTop = 1e9; }

function simulated(p){
  const l = p.toLowerCase();
  if (/joke|funny/.test(l)) return '😂 **Ek mast joke:**\n\nProgrammer doctor ke paas gaya. Doctor bola: "Aapko fever hai, rest kijiye."\nProgrammer: "System reboot karu ya cache clear karu doctor saab?" 💀';
  if (/free fire|game|bgmi|headshot/.test(l)) return '🎮 **Free Fire tip:**\n\n1. Fire button ko upar drag karo, smooth **headshots** milenge.\n2. Crouch + gloo wall quick deploy practice karo.\n3. Fire button size 45-55% rakho. **Aag laga do! 🔥**';
  if (/python|code|script/.test(l)) return '🐍 **Ye lo Python script:**\n\n```python\nimport time\n\ndef sia_wish(name):\n    print(f"Hello {name}! Sia Roy is starting...")\n    time.sleep(1)\n    print("Full energy & 100% ready!")\n\nsia_wish("Babu")\n```';
  if (/ai fact|fact/.test(l)) return '🚀 **AI fact:** Neural networks ka idea 1943 mein aaya tha, matlab AI naya nahi, bas ab computers ne pakad liya! 🤯';
  if (/^(hi|hello|hey)\b/.test(l)) return 'Arey Hello Hello! Kya haal chaal? Aaj kya banayein ya seekhein?';
  return 'Aapne bola: "' + p + '"\n\nMain abhi basic mode mein hoon, lekin jokes, Python code, gaming tips aur AI facts pooch sakte ho. 🔥';
}
async function gemini(){
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent?key=' + GEMINI_API_KEY, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text: PROMPTS[persona] }] },
      contents: hist.slice(-10).map(h => ({ role: h.role, parts:[{ text: h.text }] }))
    })
  });
  if (!r.ok) throw new Error('api');
  const j = await r.json();
  return j.candidates?.[0]?.content?.parts?.[0]?.text || 'Mera dimag blank ho gaya, wapas pucho!';
}
function speak(t){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,'code').replace(/[*#`]/g,'')); u.lang = 'hi-IN';
  speechSynthesis.speak(u);
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const t = $('input').value.trim(); if (!t) return;
  $('input').value = ''; $('input').style.height = 'auto';
  addUser(t); hist.push({ role:'user', text:t });
  const typing = document.createElement('div'); typing.className = 'note'; typing.textContent = 'Sia Roy typing...';
  $('chat').appendChild(typing); $('chat').scrollTop = 1e9;
  let out;
  try{
    if (GEMINI_API_KEY) out = await gemini();
    else { await new Promise(r => setTimeout(r, 700)); out = simulated(t); }
  }catch(err){ out = simulated(t); }
  typing.remove(); addBot(out); hist.push({ role:'model', text:out }); saveHist();
  if (voice) speak(out);
});
$('input').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('form').requestSubmit(); } });
$('chips').querySelectorAll('button').forEach(b => b.onclick = () => { $('input').value = b.textContent.replace(/^[^\w]+/,'').trim(); $('form').requestSubmit(); });
$('persona').onchange = e => { persona = e.target.value; note('Personality: ' + e.target.options[e.target.selectedIndex].text); };
$('voiceBtn').onclick = () => { voice = !voice; $('voiceBtn').textContent = voice ? '🔊' : '🔇'; if (voice) speak('Voice response on ho gaya!'); else speechSynthesis.cancel(); };
$('clearBtn').onclick = () => { hist = []; saveHist(); $('chat').innerHTML = ''; addBot('Chat clear ho gaya! Nayi shuruat karte hain.'); };
$('outBtn').onclick = logout;
$('loginBtn').onclick = login; $('signBtn').onclick = signup;
$('p').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('mic').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return note('Is browser mein voice input supported nahi hai.');
  const r = new SR(); r.lang = 'hi-IN';
  r.onresult = ev => { $('input').value = ev.results[0][0].transcript; };
  r.start();
};

(() => {
  const s = store.get('sia_session'), rec = s && getUsers()[s];
  if (rec) enter(s, rec.name);
})();
</script>
</body>
</html>
